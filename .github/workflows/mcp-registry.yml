name: Publish to MCP Registry

# Publishes server.json (the cloud relay endpoint) to the official MCP
# Registry under io.github.laughedelic/*. Runs after each release (called
# from release.yml) or by hand from the Actions tab. The version comes from
# _meta.lua; the registry refuses a version it already has.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write # GitHub OIDC login to the registry, no secret needed

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set the version from _meta.lua
        run: |
          version=$(sed -n 's/.*version = "\([0-9][0-9.]*\)".*/\1/p' _meta.lua)
          [ -n "$version" ] || { echo "No version in _meta.lua" >&2; exit 1; }
          jq --arg v "$version" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
